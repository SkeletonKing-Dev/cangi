[project]
name = "cangi"
version = "0.2.0"
description = "CAD telemetry, shared schema and in-application overlay control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cangi = "cangi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cangi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "plugins/freecad/Cangi"]
markers = ["integration: tests that open sockets or files"]
